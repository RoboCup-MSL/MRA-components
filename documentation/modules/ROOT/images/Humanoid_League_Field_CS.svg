<?xml version="1.0" standalone="yes"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg width="16.00cm" height="11.0cm" version="1.1" xmlns="http://www.w3.org/2000/svg">
<desc>Humanoid field Adult size</desc>
  <defs>
    <!-- Arrowhead marker definition -->
    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="5"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      stroke="red"
      fill="red"
      orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" />
    </marker>
  </defs>

<!-- green field width: A + 2*I   length: B + 2*I-->
<rect x="0cm" y="0cm" width="16.00cm" height="11.00cm" fill="green" stroke-width="0.02cm" />

<!-- outline field x: I y: I width: A    length: B -->
<rect x="1.0cm" y="1.0cm" width="14.00cm" height="9.00cm" fill="none" stroke="white" stroke-width="0.05cm"/>

<!-- left penalty area x: I y: I +0.5B - 0.5*K width: A    length: B -->
<rect x="1.0cm" y="2.5cm" width="3.00cm" height="6.00cm" fill="none" stroke="white" stroke-width="0.05cm"/>

<!-- left goal-area x: I y: I +0.5B - 0.5*K width: A    length: B -->
<rect x="1.0cm" y="3.5cm" width="1.00cm" height="4.00cm" fill="none" stroke="white" stroke-width="0.05cm"/>

<!-- left goal x: I-C y: I +0.5B - 0.5*D width: C    length: D -->
<!-- <rect x="0.4cm" y="4.2cm" width="0.60cm" height="2.60cm" fill="none" stroke="white" stroke-width="0.15cm"/> -->
<line x1="0.40cm" y1="4.20cm" x2="1.00cm" y2="4.20cm" stroke-width="0.15cm"  stroke="white"/>
<line x1="0.40cm" y1="6.80cm" x2="1.00cm" y2="6.80cm" stroke-width="0.15cm"  stroke="white"/>
<line x1="0.40cm" y1="4.20cm" x2="0.40cm" y2="6.80cm" stroke-width="0.15cm"  stroke="white"/>


<!-- middle line: x1: I+0.5*A y1: I  x2: I+0.5*A y2: I+B -->
<line x1="8.00cm" y1="1.00cm" x2="8.00cm" y2="10.0cm" stroke-width="0.05cm"  stroke="white"/>

<!-- middle circle: x: I+0.5*A y: I+0.5*B r: H/2 -->
<circle cx="8.0cm" cy="5.50cm" r="1.50cm" fill="none" stroke="white" stroke-width="0.05cm"  />

<!-- left penalty marker: x1: I+G-0.5*L y1: I+0.5*B-0.5*L x2: I+G+0.5*L y1: I+0.5*B+0.5*L -->
<line x1="3.10cm" y1="5.35cm" x2="3.10cm" y2="5.65cm" stroke-width="0.05cm"  stroke="white"/>
<!-- left penalty marker: x1: I+G-0.5*L y1: I+0.5*B-0.5*L x2: I+G+0.5*L y1: I+0.5*B+0.5*L -->
<line x1="2.95cm" y1="5.5cm" x2="3.25cm" y2="5.5cm" stroke-width="0.05cm"  stroke="white"/>

<!-- center marker: x1: I+0.5*L y1: I+0.5*B-0.5*L x2: I+G+0.5*L y1: I+0.5*B+0.5*L -->
<line x1="7.85cm" y1="5.50cm" x2="8.15cm" y2="5.50cm" stroke-width="0.05cm"  stroke="white"/>
<!-- cente marker: x1: I+G-0.5*L y1: I+0.5*B-0.5*L x2: I+G+0.5*L y1: I+0.5*B+0.5*L -->
<line x1="8.00cm" y1="5.35cm" x2="8.00cm" y2="5.65cm" stroke-width="0.05cm"  stroke="white"/>


<!-- right penalty marker: x1: I+G-0.5*L y1: I+0.5*B-0.5*L x2: I+G+0.5*L y1: I+0.5*B+0.5*L -->
<line x1="12.90cm" y1="5.35cm" x2="12.90cm" y2="5.65cm" stroke-width="0.05cm"  stroke="white"/>
<!-- right penalty marker: x1: I+A-G-0.5*L y1: I+0.5*B-0.5*L x2: I+G+0.5*L y1: I+0.5*B+0.5*L -->
<line x1="12.75cm" y1="5.5cm" x2="13.05cm" y2="5.5cm" stroke-width="0.05cm"  stroke="white"/>



<!-- right goal x: I+C y: I +0.5B - 0.5*D width: C    length: D -->
<!-- <rect x="0.4cm" y="4.2cm" width="0.60cm" height="2.60cm" fill="none" stroke="white" stroke-width="0.15cm"/> -->
<line x1="15.60cm" y1="4.20cm" x2="15.00cm" y2="4.20cm" stroke-width="0.15cm"  stroke="white"/>
<line x1="15.60cm" y1="6.80cm" x2="15.00cm" y2="6.80cm" stroke-width="0.15cm"  stroke="white"/>
<line x1="15.60cm" y1="4.20cm" x2="15.60cm" y2="6.80cm" stroke-width="0.15cm"  stroke="white"/>
<!-- right penalty area x: I y: I +0.5B - 0.5*K width: A    length: B -->
<rect x="12.0cm" y="2.5cm" width="3.00cm" height="6.00cm" fill="none" stroke="white" stroke-width="0.05cm"/>

<!-- right goal-area x: I y: I +0.5B - 0.5*K width: A    length: B -->
<rect x="14.0cm" y="3.5cm" width="1.00cm" height="4.00cm" fill="none" stroke="white" stroke-width="0.05cm"/>


<line x1="8.0cm" y1="5.50cm" x2="8.0cm" y2="3.50cm" stroke-width="0.05cm"  stroke="red" marker-end="url(#arrow)" />
<line x1="8.0cm" y1="5.50cm" x2="10.0cm" y2="5.50cm" stroke-width="0.05cm"  stroke="red" marker-end="url(#arrow)" />
<text x="10.6cm" y="6.0cm" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="18" fill="darkred">X +</text>
<text x="8.5cm" y="3.0cm" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="18" fill="darkred">Y +</text>

<text x="5.0cm" y="9.0cm" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="18" fill="darkred">Own half</text>
<text x="11.0cm" y="9.0cm" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="18" fill="darkred">Opponent half</text>
